sonar.projectKey=mateusz-klatt_snapper-mcp
sonar.organization=mateusz-klatt

sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=test

sonar.exclusions=dist/**,node_modules/**,coverage/**
sonar.coverage.exclusions=test/**,*.config.ts,*.config.js
sonar.cpd.exclusions=test/**

sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.environments=node

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# The MCP SDK marks its low-level Server class with @deprecated in favour
# of the high-level McpServer helper, but the same JSDoc reads: "Only use
# Server for advanced use cases." The bridge is by definition an advanced
# use case — it proxies arbitrary request/notification schemas between
# stdio and HTTP, so McpServer's tool/resource/prompt registration API
# does not fit. Suppress typescript:S1874 (deprecated API used) on the
# narrow set of files that import Server so the rule still catches
# accidental deprecated usage elsewhere.
sonar.issue.ignore.multicriteria=depServerMain,depServerProxy,depServerShutdown,depServerTests
sonar.issue.ignore.multicriteria.depServerMain.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.depServerMain.resourceKey=src/main.ts
sonar.issue.ignore.multicriteria.depServerProxy.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.depServerProxy.resourceKey=src/proxy.ts
sonar.issue.ignore.multicriteria.depServerShutdown.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.depServerShutdown.resourceKey=src/shutdown.ts
sonar.issue.ignore.multicriteria.depServerTests.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.depServerTests.resourceKey=test/**/*.ts
